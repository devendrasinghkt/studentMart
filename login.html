<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | StudentMart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-inner container">
      <a href="index.html" class="brand-logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span>Student<strong>Mart</strong></span>
      </a>
      <a href="index.html" class="btn btn-secondary btn-sm">Back to marketplace</a>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="view-tabs auth-tabs">
        <button type="button" class="tab-btn active" id="showLoginTab">Log in</button>
        <button type="button" class="tab-btn" id="showRegisterTab">Create account</button>
      </div>

      <!-- Shown when the user was sent here from the marketplace -->
      <p class="form-message info hidden" id="authNotice"></p>

      <!-- Login form -->
      <form id="loginForm" class="auth-form" novalidate>
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Log in to sell items and manage your listings.</p>

        <p class="form-message error hidden" id="loginMessage"></p>

        <div class="form-group">
          <label for="loginEmail">Email <span class="req">*</span></label>
          <input type="email" id="loginEmail" autocomplete="email" placeholder="you@campus.edu" />
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password <span class="req">*</span></label>
          <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Enter your password" />
          <span class="field-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Log in</button>

        <p class="auth-switch">
          New to StudentMart?
          <button type="button" class="btn-link" id="goToRegister">Create an account</button>
        </p>
      </form>

      <!-- Registration form -->
      <form id="registerForm" class="auth-form hidden" novalidate>
        <h1>Create your account</h1>
        <p class="auth-subtitle">It's free. Sign up to buy, sell and manage your own listings.</p>

        <p class="form-message error hidden" id="registerMessage"></p>

        <div class="form-group">
          <label for="registerName">Full name <span class="req">*</span></label>
          <input type="text" id="registerName" autocomplete="name" maxlength="50" placeholder="e.g. Alex Mehta" />
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email <span class="req">*</span></label>
          <input type="email" id="registerEmail" autocomplete="email" placeholder="you@campus.edu" />
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="registerPassword">Password <span class="req">*</span></label>
          <input type="password" id="registerPassword" autocomplete="new-password" placeholder="At least 6 characters" />
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="registerConfirm">Confirm password <span class="req">*</span></label>
          <input type="password" id="registerConfirm" autocomplete="new-password" placeholder="Re-enter your password" />
          <span class="field-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Create account</button>

        <p class="auth-switch">
          Already have an account?
          <button type="button" class="btn-link" id="goToLogin">Log in</button>
        </p>
      </form>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
